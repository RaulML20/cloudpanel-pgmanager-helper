{# BEGIN cloudpanel-pgmanager-helper #}
<script>
/* Adds a PostgreSQL section without changing the native MariaDB markup. */
(function () {
  var pgManagerPort = '__PGMANAGER_HELPER_PORT__';
  var pgManagerApiBase = 'https://' + window.location.hostname + ':' + pgManagerPort;

  function getDomainNameFromPath() {
    var segments = window.location.pathname.split('/').filter(Boolean);
    var siteIndex = segments.indexOf('site');
    if (siteIndex === -1 || !segments[siteIndex + 1]) return null;
    try {
      return decodeURIComponent(segments[siteIndex + 1]);
    } catch (error) {
      return null;
    }
  }

  function api(path, options) {
    options = options || {};
    options.credentials = 'include';
    if (options.body) options.headers = { 'Content-Type': 'application/json' };
    return fetch(pgManagerApiBase + path, options).then(function (response) {
      return response.json().then(function (payload) {
        if (!response.ok || !payload.ok) {
          throw new Error(payload && payload.error ? payload.error : 'Request failed');
        }
        return payload;
      });
    });
  }

  function findMariaDbCard() {
    var information = document.querySelector('.database-server-information');
    return information ? information.closest('.card.card-table') : null;
  }

  function findMariaDbUsersCard() {
    var cards = document.querySelectorAll('.site-content .card.card-table');
    for (var index = 0; index < cards.length; index++) {
      var addLink = cards[index].querySelector('.card-header a[href]');
      if (addLink && (/database user/i.test(addLink.textContent || '') || /\/user(?:\/|$)/i.test(addLink.getAttribute('href') || ''))) {
        return cards[index];
      }
      var headings = cards[index].querySelectorAll('thead th');
      for (var headingIndex = 0; headingIndex < headings.length; headingIndex++) {
        if (/phpmyadmin/i.test(headings[headingIndex].textContent || '')) return cards[index];
      }
    }
    return null;
  }

  function renameMariaDbHeading(card) {
    var heading = card.querySelector('.card-header > div');
    if (!heading) return;

    for (var index = 0; index < heading.childNodes.length; index++) {
      var node = heading.childNodes[index];
      if (node.nodeType === 3 && node.nodeValue.trim()) {
        node.nodeValue = node.nodeValue.replace(/Databases/i, 'MariaDB Databases');
        return;
      }
    }
  }

  function replaceFirstHeadingText(card, value) {
    var heading = card && card.querySelector('.card-header > div');
    if (!heading) return;
    for (var index = 0; index < heading.childNodes.length; index++) {
      var node = heading.childNodes[index];
      if (node.nodeType === 3 && node.nodeValue.trim()) {
        node.nodeValue = node.nodeValue.replace(node.nodeValue.trim(), value);
        return;
      }
    }
  }

  function placeCardActionAbove(card, toolbarId, action) {
    if (!card || !action || !card.parentNode || document.getElementById(toolbarId)) return null;
    var toolbar = document.createElement('div');
    toolbar.id = toolbarId;
    toolbar.style.cssText = 'display:flex;justify-content:flex-end;margin-bottom:16px';
    toolbar.appendChild(action);
    card.parentNode.insertBefore(toolbar, card);
    return action;
  }

  function moveCardActionAbove(card, toolbarId) {
    if (!card) return null;
    var action = card.querySelector('.card-header a[href], .card-header button');
    return placeCardActionAbove(card, toolbarId, action);
  }

  function mariaDbHasDatabases(card) {
    if (!card) return false;
    var rows = card.querySelectorAll('tbody tr');
    for (var index = 0; index < rows.length; index++) {
      if (rows[index].querySelector('td')) return true;
    }
    return false;
  }

  function generatedPassword() {
    if (typeof window.generatePassword === 'function') {
      try {
        var nativePassword = window.generatePassword(20);
        if (typeof nativePassword === 'string' && nativePassword) return nativePassword;
      } catch (error) {}
    }
    if (!window.crypto || typeof window.crypto.getRandomValues !== 'function') return '';
    var alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%*-_';
    var bytes = new Uint32Array(20);
    window.crypto.getRandomValues(bytes);
    var result = '';
    for (var index = 0; index < bytes.length; index++) result += alphabet[bytes[index] % alphabet.length];
    return result;
  }

  function openCreatePostgresUserDialog(card, domainName, databases) {
    var oldDialog = document.getElementById('pgmanager-create-user-dialog');
    if (oldDialog) oldDialog.remove();

    var overlay = document.createElement('div');
    overlay.id = 'pgmanager-create-user-dialog';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:1050;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px';
    var dialog = document.createElement('div');
    dialog.className = 'card';
    dialog.style.cssText = 'width:min(760px,100%);max-height:90vh;overflow:auto';
    dialog.innerHTML =
      '<div class="card-header">Add PostgreSQL Database User</div>' +
      '<div class="card-body">' +
        '<div class="alert alert-danger pgmanager-create-user-error" style="display:none"></div>' +
        '<div class="row">' +
          '<div class="col-6"><label class="col-form-label">Database User Name *</label><input class="form-control pgmanager-create-user-name" autocomplete="off"></div>' +
          '<div class="col-6"><label class="col-form-label">Database User Password *</label><input type="password" class="form-control pgmanager-create-user-password" autocomplete="new-password"><a href="javascript:void(0)" class="pgmanager-create-user-generate">Generate new password</a></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="col-6"><label class="col-form-label">Database *</label><select class="form-select pgmanager-create-user-database"></select></div>' +
          '<div class="col-6"><label class="col-form-label">Permissions *</label><select class="form-select pgmanager-create-user-permissions"><option value="read_write">Read and Write</option><option value="read_only">Read Only</option></select></div>' +
        '</div>' +
        '<div class="row mt-3"><div class="col text-end"><button type="button" class="btn btn-md btn-white pgmanager-create-user-cancel">Cancel</button> <button type="button" class="btn btn-md btn-blue pgmanager-create-user-save">Add Database User</button></div></div>' +
      '</div>';
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);

    var databaseSelect = dialog.querySelector('.pgmanager-create-user-database');
    databases.forEach(function (database) {
      var option = document.createElement('option');
      option.value = database.name;
      option.textContent = database.name;
      databaseSelect.appendChild(option);
    });
    dialog.querySelector('.pgmanager-create-user-password').value = generatedPassword();
    dialog.querySelector('.pgmanager-create-user-generate').addEventListener('click', function () {
      dialog.querySelector('.pgmanager-create-user-password').value = generatedPassword();
    });
    dialog.querySelector('.pgmanager-create-user-cancel').addEventListener('click', function () { overlay.remove(); });
    overlay.addEventListener('click', function (event) { if (event.target === overlay) overlay.remove(); });
    dialog.querySelector('.pgmanager-create-user-save').addEventListener('click', function () {
      var save = this;
      var errorBox = dialog.querySelector('.pgmanager-create-user-error');
      save.disabled = true;
      errorBox.style.display = 'none';
      api('/api/postgresql/users', {
        method: 'POST',
        body: JSON.stringify({
          domainName: domainName,
          databaseName: databaseSelect.value,
          userName: dialog.querySelector('.pgmanager-create-user-name').value,
          password: dialog.querySelector('.pgmanager-create-user-password').value,
          permissions: dialog.querySelector('.pgmanager-create-user-permissions').value
        })
      }).then(function () {
        window.location.reload();
      }).catch(function (error) {
        errorBox.textContent = error.message;
        errorBox.style.display = '';
        save.disabled = false;
      });
    });
  }

  function createPostgresUserButton(reference, card, domainName, databases) {
    var button = document.createElement('a');
    button.href = 'javascript:void(0)';
    button.className = reference && reference.className ? reference.className : 'btn btn-md btn-blue';
    button.textContent = 'Add Database User';
    button.addEventListener('click', function () {
      openCreatePostgresUserDialog(card, domainName, databases);
    });
    return button;
  }

  function showPostgresError(card, message) {
    var error = card.querySelector('.pgmanager-users-error');
    if (!error) {
      error = document.createElement('div');
      error.className = 'alert alert-danger m-3 pgmanager-users-error';
      card.insertBefore(error, card.children[1] || null);
    }
    error.textContent = message;
  }

  function appendTextCell(row, value, className) {
    var cell = document.createElement('td');
    if (className) cell.className = className;
    cell.textContent = value;
    row.appendChild(cell);
  }

  function renderMappingReport(dialog, report) {
    var box = dialog.querySelector('.pgmanager-mapping-report');
    box.replaceChildren();
    if (!report) {
      box.style.display = 'none';
      return;
    }
    box.style.display = '';
    box.className = 'alert pgmanager-mapping-report ' + (report.ok ? 'alert-success' : 'alert-danger');
    var lines = [];
    if (report.envPath) lines.push('Configuration file: ' + report.envPath);
    if (report.ok) {
      lines.push('Read from: ' + (report.source || '-'));
      lines.push('Host: ' + report.host + ':' + report.port);
      lines.push('User: ' + report.user);
      lines.push('Database: ' + report.dbname);
      lines.push('Password configured: ' + (report.passwordConfigured ? 'Yes' : 'No'));
    } else {
      lines.push(report.error || 'The connection could not be resolved.');
    }
    lines.forEach(function (line) {
      var item = document.createElement('div');
      item.textContent = line;
      box.appendChild(item);
    });
  }

  function openMappingDialog(card, domainName, databaseName) {
    var oldDialog = document.getElementById('pgmanager-mapping-dialog');
    if (oldDialog) oldDialog.remove();

    var overlay = document.createElement('div');
    overlay.id = 'pgmanager-mapping-dialog';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:1050;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px';
    var dialog = document.createElement('div');
    dialog.className = 'card';
    dialog.style.cssText = 'width:min(900px,100%);max-height:92vh;overflow:auto';
    dialog.innerHTML =
      '<div class="card-header">PostgreSQL Connection Settings</div>' +
      '<div class="card-body">' +
        '<p>Database: <strong class="pgmanager-mapping-database"></strong></p>' +
        '<p>Leave every field empty to use automatic detection. When a Connection URL variable is configured, it is used on its own and the other fields are ignored.</p>' +
        '<div class="alert alert-info">Enter variable names, not their values. For example: <code>PG_DATABASE_PROD</code>. Password values are never displayed or stored by this helper.</div>' +
        '<div class="alert alert-danger pgmanager-mapping-error" style="display:none"></div>' +
        '<div class="alert pgmanager-mapping-report" style="display:none"></div>' +
        '<div class="row">' +
          '<div class="col-12"><label class="col-form-label">Connection URL variable</label><input class="form-control" data-mapping-field="url"><small>A complete postgres:// or postgresql:// URL. Leave empty to use the separate fields.</small></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="col-6"><label class="col-form-label">Host variable</label><input class="form-control" data-mapping-field="host"><small>Defaults to localhost when empty.</small></div>' +
          '<div class="col-6"><label class="col-form-label">Port variable</label><input class="form-control" data-mapping-field="port"><small>Defaults to 5432 when empty.</small></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="col-6"><label class="col-form-label">User variable</label><input class="form-control" data-mapping-field="user"></div>' +
          '<div class="col-6"><label class="col-form-label">Password variable</label><input class="form-control" data-mapping-field="password"></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="col-6"><label class="col-form-label">Database name variable</label><input class="form-control" data-mapping-field="dbname"></div>' +
        '</div>' +
        '<div class="row mt-3"><div class="col text-end"><button type="button" class="btn btn-md btn-white pgmanager-mapping-cancel">Cancel</button> <button type="button" class="btn btn-md btn-blue pgmanager-mapping-save">Save</button></div></div>' +
      '</div>';
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);
    dialog.querySelector('.pgmanager-mapping-database').textContent = databaseName;

    var errorBox = dialog.querySelector('.pgmanager-mapping-error');
    var save = dialog.querySelector('.pgmanager-mapping-save');
    function showError(error) {
      errorBox.textContent = error.message || String(error);
      errorBox.style.display = '';
    }
    function fill(payload) {
      var mapping = payload.mapping || {};
      dialog.querySelectorAll('[data-mapping-field]').forEach(function (input) {
        input.value = mapping[input.getAttribute('data-mapping-field')] || '';
      });
      renderMappingReport(dialog, payload.report);
    }

    dialog.querySelector('.pgmanager-mapping-cancel').addEventListener('click', function () { overlay.remove(); });
    overlay.addEventListener('click', function (event) { if (event.target === overlay) overlay.remove(); });
    save.disabled = true;
    api('/api/postgresql/mapping?domainName=' + encodeURIComponent(domainName) + '&databaseName=' + encodeURIComponent(databaseName))
      .then(function (payload) { fill(payload); save.disabled = false; })
      .catch(function (error) { showError(error); });

    save.addEventListener('click', function () {
      var mapping = {};
      dialog.querySelectorAll('[data-mapping-field]').forEach(function (input) {
        mapping[input.getAttribute('data-mapping-field')] = input.value.trim();
      });
      save.disabled = true;
      errorBox.style.display = 'none';
      api('/api/postgresql/mapping', {
        method: 'POST',
        body: JSON.stringify({ domainName: domainName, databaseName: databaseName, mapping: mapping })
      }).then(function (payload) {
        fill(payload);
        save.disabled = false;
      }).catch(function (error) {
        showError(error);
        save.disabled = false;
      });
    });
  }

  function deletePostgresDatabase(card, domainName, databaseName) {
    if (!window.confirm('Are you sure?')) return;
    api('/api/postgresql/databases/delete', {
      method: 'POST',
      body: JSON.stringify({ domainName: domainName, databaseName: databaseName })
    }).then(function (payload) {
      var warnings = payload.database && payload.database.roleCleanupWarnings;
      if (Array.isArray(warnings) && warnings.length) {
        window.alert('The database was deleted, but these shared/in-use PostgreSQL roles were kept: ' + warnings.join(', '));
      }
      window.location.reload();
    }).catch(function (error) {
      showPostgresError(card, error.message);
    });
  }

  function exportPostgresDatabase(card, domainName, databaseName, action) {
    var originalText = action.textContent;
    action.textContent = 'Preparing...';
    action.style.pointerEvents = 'none';
    api('/api/postgresql/export-ticket', {
      method: 'POST',
      body: JSON.stringify({ domainName: domainName, databaseName: databaseName })
    }).then(function (payload) {
      var download = document.createElement('a');
      download.href = pgManagerApiBase + payload.exportPath;
      download.style.display = 'none';
      document.body.appendChild(download);
      download.click();
      window.setTimeout(function () { download.remove(); }, 60000);
    }).catch(function (error) {
      showPostgresError(card, error.message);
    }).finally(function () {
      action.textContent = originalText;
      action.style.pointerEvents = '';
    });
  }

  function formatBytes(value) {
    var units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
    var size = Number(value || 0);
    var unit = 0;
    while (size >= 1024 && unit < units.length - 1) { size /= 1024; unit++; }
    return (unit ? size.toFixed(size >= 10 ? 1 : 2) : String(size)) + ' ' + units[unit];
  }

  function openImportPostgresDialog(card, domainName, databaseName, maxImportBytes) {
    var oldDialog = document.getElementById('pgmanager-import-dialog');
    if (oldDialog) oldDialog.remove();

    var overlay = document.createElement('div');
    overlay.id = 'pgmanager-import-dialog';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:1050;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px';
    var dialog = document.createElement('div');
    dialog.className = 'card';
    dialog.style.cssText = 'width:min(720px,100%);max-height:90vh;overflow:auto';
    dialog.innerHTML =
      '<div class="card-header">Import PostgreSQL Database</div>' +
      '<div class="card-body">' +
        '<p>Target database: <strong class="pgmanager-import-database"></strong></p>' +
        '<div class="alert alert-warning">Importing changes the target database. Only import dumps from a trusted source. Custom and tar dumps clean matching objects before restoring them; plain SQL is executed as provided. Do not close this page until the operation finishes.</div>' +
        '<div class="alert alert-danger pgmanager-import-error" style="display:none"></div>' +
        '<label class="col-form-label">Dump file *</label>' +
        '<input type="file" class="form-control pgmanager-import-file" accept=".dump,.backup,.tar,.sql,application/octet-stream,application/sql">' +
        '<small>Supported formats: PostgreSQL custom/tar dump and plain SQL. Maximum upload: <span class="pgmanager-import-limit"></span>.</small>' +
        '<div class="pgmanager-import-progress mt-3" style="display:none"></div>' +
        '<div class="row mt-3"><div class="col text-end"><button type="button" class="btn btn-md btn-white pgmanager-import-cancel">Cancel</button> <button type="button" class="btn btn-md btn-blue pgmanager-import-save">Import</button></div></div>' +
      '</div>';
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);

    dialog.querySelector('.pgmanager-import-database').textContent = databaseName;
    dialog.querySelector('.pgmanager-import-limit').textContent = formatBytes(maxImportBytes);
    var cancel = dialog.querySelector('.pgmanager-import-cancel');
    var save = dialog.querySelector('.pgmanager-import-save');
    var fileInput = dialog.querySelector('.pgmanager-import-file');
    var errorBox = dialog.querySelector('.pgmanager-import-error');
    var progress = dialog.querySelector('.pgmanager-import-progress');

    cancel.addEventListener('click', function () { overlay.remove(); });
    overlay.addEventListener('click', function (event) { if (event.target === overlay && !save.disabled) overlay.remove(); });
    save.addEventListener('click', function () {
      var file = fileInput.files && fileInput.files[0];
      errorBox.style.display = 'none';
      if (!file) {
        errorBox.textContent = 'Choose a dump file to import.';
        errorBox.style.display = '';
        return;
      }
      if (file.size > maxImportBytes) {
        errorBox.textContent = 'The selected file exceeds the configured import limit.';
        errorBox.style.display = '';
        return;
      }
      if (!window.confirm('Import this file into ' + databaseName + '? Existing matching objects may be replaced.')) return;

      save.disabled = true;
      cancel.disabled = true;
      fileInput.disabled = true;
      save.textContent = 'Importing...';
      progress.style.display = '';
      progress.textContent = 'Uploading 0%';

      var request = new XMLHttpRequest();
      request.open('POST', pgManagerApiBase + '/api/postgresql/import?domainName=' + encodeURIComponent(domainName) + '&databaseName=' + encodeURIComponent(databaseName));
      request.withCredentials = true;
      request.setRequestHeader('Content-Type', 'application/octet-stream');
      request.upload.addEventListener('progress', function (event) {
        if (event.lengthComputable) progress.textContent = 'Uploading ' + Math.round((event.loaded / event.total) * 100) + '%';
      });
      request.upload.addEventListener('load', function () { progress.textContent = 'Upload complete. Restoring database...'; });
      request.addEventListener('load', function () {
        var payload = null;
        try { payload = JSON.parse(request.responseText); } catch (error) {}
        if (request.status < 200 || request.status >= 300 || !payload || !payload.ok) {
          errorBox.textContent = payload && payload.error ? payload.error : 'Database import failed.';
          errorBox.style.display = '';
          save.disabled = false;
          cancel.disabled = false;
          fileInput.disabled = false;
          save.textContent = 'Import';
          progress.style.display = 'none';
          return;
        }
        var warnings = payload.database && payload.database.permissionWarnings;
        if (Array.isArray(warnings) && warnings.length) {
          window.alert('The database was imported, but permissions could not be refreshed for: ' + warnings.join(', '));
        }
        window.location.reload();
      });
      request.addEventListener('error', function () {
        errorBox.textContent = 'The upload connection failed.';
        errorBox.style.display = '';
        save.disabled = false;
        cancel.disabled = false;
        fileInput.disabled = false;
        save.textContent = 'Import';
        progress.style.display = 'none';
      });
      request.send(file);
    });
  }

  function buildPostgresCard(postgresql, domainName) {
    var databases = Array.isArray(postgresql.databases) ? postgresql.databases : [];
    var card = document.createElement('div');
    card.className = 'card card-table';
    card.id = 'pgmanager-postgresql-databases';

    var header = document.createElement('div');
    header.className = 'card-header d-flex justify-content-between';
    var heading = document.createElement('div');
    heading.appendChild(document.createTextNode('PostgreSQL Databases'));

    var information = document.createElement('span');
    information.className = 'database-server-information';
    var list = document.createElement('ul');
    var hostItem = document.createElement('li');
    var hostLabel = document.createElement('strong');
    hostLabel.textContent = 'Host';
    hostItem.appendChild(hostLabel);
    hostItem.appendChild(document.createTextNode(': ' + (postgresql.host || '-')));
    var portItem = document.createElement('li');
    var portLabel = document.createElement('strong');
    portLabel.textContent = 'Port';
    portItem.appendChild(portLabel);
    portItem.appendChild(document.createTextNode(': ' + (postgresql.port || '-')));
    list.appendChild(hostItem);
    list.appendChild(portItem);
    information.appendChild(list);
    heading.appendChild(information);
    header.appendChild(heading);
    card.appendChild(header);

    if (!postgresql.available) {
      var unavailableBody = document.createElement('div');
      unavailableBody.className = 'card-body';
      unavailableBody.textContent = postgresql.error || 'PostgreSQL is installed but is not available.';
      card.appendChild(unavailableBody);
      return card;
    }

    if (!databases.length) {
      var emptyBody = document.createElement('div');
      emptyBody.className = 'card-body';
      emptyBody.textContent = 'No PostgreSQL databases found for this site.';
      card.appendChild(emptyBody);
      return card;
    }

    var body = document.createElement('div');
    body.className = 'card-body card-body-no-padding';
    var table = document.createElement('table');
    table.className = 'table';
    var tableHead = document.createElement('thead');
    var headerRow = document.createElement('tr');
    var databaseHeading = document.createElement('th');
    databaseHeading.textContent = 'Database';
    var actionHeading = document.createElement('th');
    actionHeading.width = '340';
    actionHeading.className = 'text-end';
    actionHeading.textContent = 'Action';
    headerRow.appendChild(databaseHeading);
    headerRow.appendChild(actionHeading);
    tableHead.appendChild(headerRow);
    table.appendChild(tableHead);

    var tableBody = document.createElement('tbody');
    databases.forEach(function (database) {
      var row = document.createElement('tr');
      appendTextCell(row, database.name || '');
      var actionCell = document.createElement('td');
      actionCell.className = 'text-end table-actions';
      actionCell.style.whiteSpace = 'nowrap';
      var actions = document.createElement('span');
      actions.style.cssText = 'display:inline-flex;align-items:center;justify-content:flex-end;gap:16px;white-space:nowrap';
      var settings = document.createElement('a');
      settings.href = 'javascript:void(0)';
      settings.textContent = 'Settings';
      settings.title = 'PostgreSQL Connection Settings';
      settings.addEventListener('click', function () {
        openMappingDialog(card, domainName, database.name);
      });
      actions.appendChild(settings);
      var exportAction = document.createElement('a');
      exportAction.href = 'javascript:void(0)';
      exportAction.textContent = 'Export';
      exportAction.addEventListener('click', function () {
        exportPostgresDatabase(card, domainName, database.name, exportAction);
      });
      actions.appendChild(exportAction);
      var importAction = document.createElement('a');
      importAction.href = 'javascript:void(0)';
      importAction.textContent = 'Import';
      importAction.addEventListener('click', function () {
        openImportPostgresDialog(card, domainName, database.name, postgresql.maxImportBytes);
      });
      actions.appendChild(importAction);
      var remove = document.createElement('a');
      remove.href = 'javascript:void(0)';
      remove.className = 'delete';
      remove.textContent = 'Delete';
      remove.addEventListener('click', function () {
        deletePostgresDatabase(card, domainName, database.name);
      });
      actions.appendChild(remove);
      actionCell.appendChild(actions);
      row.appendChild(actionCell);
      tableBody.appendChild(row);
    });
    table.appendChild(tableBody);
    body.appendChild(table);
    card.appendChild(body);
    return card;
  }

  function permissionLabel(value) {
    return value === 'read_only' ? 'Read Only' : 'Read and Write';
  }

  function openEditUserDialog(card, domainName, user) {
    var oldDialog = document.getElementById('pgmanager-edit-user-dialog');
    if (oldDialog) oldDialog.remove();

    var overlay = document.createElement('div');
    overlay.id = 'pgmanager-edit-user-dialog';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:1050;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px';
    var dialog = document.createElement('div');
    dialog.className = 'card';
    dialog.style.cssText = 'width:min(720px,100%);max-height:90vh;overflow:auto';
    dialog.innerHTML =
      '<div class="card-header">Edit PostgreSQL Database User</div>' +
      '<div class="card-body">' +
        '<div class="alert alert-danger pgmanager-edit-error" style="display:none"></div>' +
        '<div class="row">' +
          '<div class="col-6"><label class="col-form-label">Database User Name</label><input class="form-control pgmanager-edit-name" disabled></div>' +
          '<div class="col-6"><label class="col-form-label">New Password</label><input type="password" class="form-control pgmanager-edit-password"><a href="javascript:void(0)" class="pgmanager-generate-password">Generate new password</a><br><small>Leave empty to keep the current password.</small></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="col-6"><label class="col-form-label">Database</label><input class="form-control pgmanager-edit-database" disabled></div>' +
          '<div class="col-6"><label class="col-form-label">Permissions</label><select class="form-select pgmanager-edit-permissions"><option value="read_write">Read and Write</option><option value="read_only">Read Only</option></select></div>' +
        '</div>' +
        '<div class="row mt-3"><div class="col text-end"><button type="button" class="btn btn-md btn-white pgmanager-edit-cancel">Cancel</button> <button type="button" class="btn btn-md btn-blue pgmanager-edit-save">Save</button></div></div>' +
      '</div>';
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);

    dialog.querySelector('.pgmanager-edit-name').value = user.userName;
    dialog.querySelector('.pgmanager-edit-database').value = user.databaseName;
    dialog.querySelector('.pgmanager-edit-permissions').value = user.permissions;
    dialog.querySelector('.pgmanager-generate-password').addEventListener('click', function () {
      if (typeof window.generatePassword === 'function') {
        dialog.querySelector('.pgmanager-edit-password').value = window.generatePassword(20);
      }
    });
    dialog.querySelector('.pgmanager-edit-cancel').addEventListener('click', function () { overlay.remove(); });
    overlay.addEventListener('click', function (event) { if (event.target === overlay) overlay.remove(); });
    dialog.querySelector('.pgmanager-edit-save').addEventListener('click', function () {
      var save = this;
      var errorBox = dialog.querySelector('.pgmanager-edit-error');
      save.disabled = true;
      errorBox.style.display = 'none';
      api('/api/postgresql/users/update', {
        method: 'POST',
        body: JSON.stringify({
          domainName: domainName,
          databaseName: user.databaseName,
          userName: user.userName,
          password: dialog.querySelector('.pgmanager-edit-password').value,
          permissions: dialog.querySelector('.pgmanager-edit-permissions').value
        })
      }).then(function () {
        window.location.reload();
      }).catch(function (error) {
        errorBox.textContent = error.message;
        errorBox.style.display = '';
        save.disabled = false;
      });
    });
  }

  function openAdminer(card, domainName, databaseName) {
    var popup = window.open('about:blank', '_blank');
    if (popup) popup.document.title = 'Opening Adminer...';

    api('/api/postgresql/adminer-ticket', {
      method: 'POST',
      body: JSON.stringify({ domainName: domainName, databaseName: databaseName })
    }).then(function (payload) {
      var destination = pgManagerApiBase + payload.adminerPath;
      if (popup) popup.location.replace(destination);
      else window.open(destination, '_blank');
    }).catch(function (error) {
      if (popup) popup.close();
      showPostgresError(card, error.message);
    });
  }

  function deletePostgresUser(card, domainName, user) {
    if (!window.confirm('Are you sure?')) return;
    api('/api/postgresql/users/delete', {
      method: 'POST',
      body: JSON.stringify({
        domainName: domainName,
        databaseName: user.databaseName,
        userName: user.userName
      })
    }).then(function () {
      window.location.reload();
    }).catch(function (error) {
      showPostgresError(card, error.message);
    });
  }

  function buildPostgresUsersCard(postgresql, domainName) {
    var users = Array.isArray(postgresql.users) ? postgresql.users : [];
    var card = document.createElement('div');
    card.className = 'card card-table';
    card.id = 'pgmanager-postgresql-users';

    var header = document.createElement('div');
    header.className = 'card-header d-flex justify-content-between';
    var heading = document.createElement('div');
    heading.textContent = 'PostgreSQL Database Users';
    header.appendChild(heading);
    card.appendChild(header);

    if (!users.length) {
      var empty = document.createElement('div');
      empty.className = 'card-body';
      empty.textContent = 'No PostgreSQL database users found.';
      card.appendChild(empty);
      return card;
    }

    var body = document.createElement('div');
    body.className = 'card-body card-body-no-padding';
    var table = document.createElement('table');
    table.className = 'table';
    table.innerHTML = '<thead><tr><th>User Name</th><th width="300">Database</th><th width="250">Adminer</th><th width="250">Permissions</th><th width="100" class="text-end">Action</th></tr></thead>';
    var tableBody = document.createElement('tbody');

    users.forEach(function (user) {
      var row = document.createElement('tr');
      var userCell = document.createElement('td');
      var edit = document.createElement('a');
      edit.href = 'javascript:void(0)';
      edit.textContent = user.userName;
      edit.addEventListener('click', function () { openEditUserDialog(card, domainName, user); });
      userCell.appendChild(edit);
      row.appendChild(userCell);
      appendTextCell(row, user.databaseName);

      var manageCell = document.createElement('td');
      var manage = document.createElement('a');
      manage.href = 'javascript:void(0)';
      manage.textContent = 'Manage';
      manage.addEventListener('click', function () { openAdminer(card, domainName, user.databaseName); });
      manageCell.appendChild(manage);
      row.appendChild(manageCell);
      appendTextCell(row, permissionLabel(user.permissions));

      var actionCell = document.createElement('td');
      actionCell.className = 'text-end table-actions';
      var remove = document.createElement('a');
      remove.href = 'javascript:void(0)';
      remove.className = 'delete';
      remove.textContent = 'Delete';
      remove.addEventListener('click', function () { deletePostgresUser(card, domainName, user); });
      actionCell.appendChild(remove);
      row.appendChild(actionCell);
      tableBody.appendChild(row);
    });

    table.appendChild(tableBody);
    body.appendChild(table);
    card.appendChild(body);
    return card;
  }

  function padTwo(value) {
    return (value < 10 ? '0' : '') + value;
  }

  function labelledField(labelText, control) {
    var wrapper = document.createElement('div');
    wrapper.style.cssText = 'display:flex;flex-direction:column;gap:4px';
    var label = document.createElement('label');
    label.className = 'form-label';
    label.style.marginBottom = '0';
    label.textContent = labelText;
    wrapper.appendChild(label);
    wrapper.appendChild(control);
    return wrapper;
  }

  /*
   * Daily dumps land in the site home, so CloudPanel's existing remote backup
   * carries them off untouched. This card only edits PgManager's own schedule;
   * CloudPanel's backup configuration is never written from here.
   */
  function buildPostgresBackupCard(domainName, databases) {
    var card = document.createElement('div');
    card.className = 'card card-table';
    card.id = 'pgmanager-postgresql-backups';

    var header = document.createElement('div');
    header.className = 'card-header d-flex justify-content-between';
    var heading = document.createElement('div');
    heading.textContent = 'PostgreSQL Daily Backups';
    header.appendChild(heading);
    card.appendChild(header);

    var body = document.createElement('div');
    body.className = 'card-body';
    card.appendChild(body);

    var hint = document.createElement('p');
    hint.className = 'text-muted';
    hint.style.cssText = 'margin-bottom:16px';
    body.appendChild(hint);

    var controls = document.createElement('div');
    controls.style.cssText = 'display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px';
    body.appendChild(controls);

    var enabled = document.createElement('input');
    enabled.type = 'checkbox';
    enabled.className = 'form-check-input';
    var enabledWrapper = document.createElement('div');
    enabledWrapper.className = 'form-check';
    enabledWrapper.style.cssText = 'display:flex;align-items:center;gap:8px;margin:0 0 8px 0';
    var enabledLabel = document.createElement('label');
    enabledLabel.className = 'form-check-label';
    enabledLabel.textContent = 'Enabled';
    enabledWrapper.appendChild(enabled);
    enabledWrapper.appendChild(enabledLabel);
    controls.appendChild(enabledWrapper);

    var time = document.createElement('input');
    time.type = 'time';
    time.className = 'form-control';
    time.style.width = '140px';
    controls.appendChild(labelledField('Runs daily at', time));

    var retention = document.createElement('input');
    retention.type = 'number';
    retention.className = 'form-control';
    retention.min = '1';
    retention.max = '365';
    retention.style.width = '120px';
    controls.appendChild(labelledField('Keep for (days)', retention));

    var save = document.createElement('button');
    save.type = 'button';
    save.className = 'btn btn-primary';
    save.textContent = 'Save';
    controls.appendChild(save);

    var status = document.createElement('div');
    status.className = 'text-muted';
    status.style.cssText = 'margin-top:12px';
    body.appendChild(status);

    var runsBody = document.createElement('div');
    runsBody.className = 'card-body card-body-no-padding';
    card.appendChild(runsBody);

    function renderRuns(lastRun) {
      runsBody.textContent = '';
      if (!databases.length) return;

      var table = document.createElement('table');
      table.className = 'table';
      table.innerHTML = '<thead><tr><th>Database</th><th width="220">Last backup</th><th width="140">Result</th><th width="140">Size</th></tr></thead>';
      var tableBody = document.createElement('tbody');

      databases.forEach(function (database) {
        var name = database.name || '';
        var entry = lastRun && lastRun[name] ? lastRun[name] : null;
        var row = document.createElement('tr');
        appendTextCell(row, name);
        appendTextCell(row, entry && entry.at ? new Date(entry.at).toLocaleString() : 'Never');
        appendTextCell(row, entry ? (entry.ok ? 'OK' : (entry.error || 'Failed')) : '-');
        appendTextCell(row, entry && entry.ok ? formatBytes(entry.size) : '-');
        tableBody.appendChild(row);
      });

      table.appendChild(tableBody);
      runsBody.appendChild(table);
    }

    function apply(payload) {
      var settings = payload.settings || {};
      enabled.checked = settings.enabled === true;
      time.value = padTwo(settings.hour || 0) + ':' + padTwo(settings.minute || 0);
      retention.value = String(settings.retentionDays || 7);
      hint.textContent = 'Dumps are written to ' + (payload.backupDirectory || '') +
        ' and are included in the CloudPanel remote backup of the site home.';
      status.textContent = settings.enabled
        ? 'Scheduled daily at ' + padTwo(settings.hour) + ':' + padTwo(settings.minute) + '.'
        : 'Daily backups are currently disabled.';
      renderRuns(payload.lastRun);
    }

    save.addEventListener('click', function () {
      var parts = String(time.value || '').split(':');
      save.disabled = true;
      save.textContent = 'Saving...';

      api('/api/postgresql/backup-settings', {
        method: 'POST',
        body: JSON.stringify({
          domainName: domainName,
          enabled: enabled.checked,
          hour: Number(parts[0]),
          minute: Number(parts[1]),
          retentionDays: Number(retention.value)
        })
      }).then(function (payload) {
        apply(payload);
      }).catch(function (error) {
        showPostgresError(card, error.message);
      }).then(function () {
        save.disabled = false;
        save.textContent = 'Save';
      });
    });

    api('/api/postgresql/backup-settings?domainName=' + encodeURIComponent(domainName))
      .then(apply)
      .catch(function (error) {
        showPostgresError(card, error.message);
      });

    return card;
  }

  function start() {
    var domainName = getDomainNameFromPath();
    if (!domainName || document.getElementById('pgmanager-postgresql-databases')) return;

    var mariaDbCard = findMariaDbCard();
    if (!mariaDbCard) return;

    api('/api/postgresql?domainName=' + encodeURIComponent(domainName))
      .then(function (payload) {
        var postgresql = payload.postgresql || {};
        if (!postgresql.installed) return;

        var hasMariaDbDatabases = mariaDbHasDatabases(mariaDbCard);
        renameMariaDbHeading(mariaDbCard);
        moveCardActionAbove(mariaDbCard, 'pgmanager-database-actions');
        var postgresCard = buildPostgresCard(postgresql, domainName);
        mariaDbCard.parentNode.insertBefore(postgresCard, mariaDbCard.nextSibling);

        var databases = Array.isArray(postgresql.databases) ? postgresql.databases : [];
        var backupCard = null;
        if (postgresql.available && databases.length) {
          backupCard = buildPostgresBackupCard(domainName, databases);
          postgresCard.parentNode.insertBefore(backupCard, postgresCard.nextSibling);
        }

        if (databases.length) {
          var anchorCard = backupCard || postgresCard;
          var nativeUsersCard = findMariaDbUsersCard();
          var postgresUsersCard = buildPostgresUsersCard(postgresql, domainName);
          if (nativeUsersCard) {
            replaceFirstHeadingText(nativeUsersCard, 'MariaDB Database Users');
            nativeUsersCard.parentNode.insertBefore(postgresUsersCard, nativeUsersCard.nextSibling);
          } else {
            anchorCard.parentNode.insertBefore(postgresUsersCard, anchorCard.nextSibling);
          }

          if (hasMariaDbDatabases && nativeUsersCard) {
            moveCardActionAbove(nativeUsersCard, 'pgmanager-user-actions');
          } else {
            var nativeAdd = nativeUsersCard
              ? nativeUsersCard.querySelector('.card-header a[href], .card-header button')
              : null;
            var databaseAdd = document.querySelector('#pgmanager-database-actions a, #pgmanager-database-actions button');
            var addUser = createPostgresUserButton(nativeAdd || databaseAdd, postgresUsersCard, domainName, databases);
            if (nativeAdd) nativeAdd.remove();
            placeCardActionAbove(nativeUsersCard || postgresUsersCard, 'pgmanager-user-actions', addUser);
          }
        }
      })
      .catch(function (error) {
        // A missing/unreachable helper must leave CloudPanel's native database
        // page exactly as it was, rather than replacing it with an error.
        console.error('PgManager:', error.message);
      });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
{# END cloudpanel-pgmanager-helper #}
